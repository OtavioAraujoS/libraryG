services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: libraryg-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STEAM_ID=${STEAM_ID:-}
      - STEAM_ACCESS_TOKEN=${STEAM_ACCESS_TOKEN:-}
      - STEAM_FAMILY_GROUP_ID=${STEAM_FAMILY_GROUP_ID:-}
      - GOG_CLIENT_ID=${GOG_CLIENT_ID:-}
      - GOG_CLIENT_SECRET=${GOG_CLIENT_SECRET:-}
      - EPIC_CLIENT_ID=${EPIC_CLIENT_ID:-}
      - EPIC_CLIENT_SECRET=${EPIC_CLIENT_SECRET:-}
      - EPIC_REFRESH_TOKEN=${EPIC_REFRESH_TOKEN:-}
      - SYNC_SECRET=${SYNC_SECRET:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/generated
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./prisma/schema.prisma
